<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delta Rising Foundation - Join Us</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f9;
  margin:0;
  padding:30px;
}

.container{
  max-width:720px;
  background:white;
  margin:auto;
  padding:30px;
  border-radius:14px;
  box-shadow:0 0 20px rgba(0,0,0,0.08);
}

h1{
  text-align:center;
  color:#0d47a1;
}

p{
  text-align:center;
  color:#555;
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin-top:8px;
  margin-bottom:18px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:120px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  background:#0d47a1;
  color:white;
  font-size:16px;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#08367c;
}

.hidden{
  display:none;
}

.success{
  color:green;
  text-align:center;
  margin-top:15px;
}

.error{
  color:red;
  text-align:center;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>Join Delta Rising Foundation</h1>
<p>Support our mission through volunteering, funding, partnerships or advocacy.</p>

<form id="leadForm">

<label>Full Name *</label>
<input type="text" id="name" required>

<label>Email</label>
<input type="email" id="email">

<label>Phone</label>
<input type="tel" id="phone">

<label>Stakeholder Type *</label>
<select id="stakeholder" required>
<option value="">Select</option>
<option>Donor</option>
<option>Carbon Buyer</option>
<option>NCC Buyer</option>
<option>Project Owner</option>
<option>Investor</option>
<option>Entrepreneur</option>
<option>Partner</option>
<option>Community Member</option>
<option>Government</option>
<option>Media</option>
<option>Supplier</option>
<option>Retail Manager</option>
<option>Volunteer</option>
<option>Other</option>
</select>

<label>Interest Segment</label>
<select id="interest">
<option value="">Select</option>
<option>Cultivating Women Leaders</option>
<option>Green Sound Screen</option>
<option>Heptagon Butterfly Tunnel</option>
<option>More Shade</option>
<option>Music</option>
<option>Nursery Plant</option>
<option>Science</option>
<option>Social Entrepreneurs</option>
<option>Surviving Current Regime</option>
<option>Sustainability Showcases</option>
<option>Carbon Project Finance</option>
<option>Carbon Project Owners</option>
<option>Carbon Credit Buyers</option>
<option>NCC Finance</option>
<option>NCC Project Owners</option>
<option>NCC Buyers</option>
<option>Must CARB Offset</option>
</select>

<label>Lead Source *</label>
<select id="leadsource" required>
<option value="">Select</option>
<option>Web</option>
<option>Social Media</option>
<option>Event</option>
<option>Phone Inquiry</option>
<option>Partner Referral</option>
<option>Word of mouth</option>
</select>

<div id="socialBox" class="hidden">
<label>Social Media Platform</label>
<select id="socialplatform">
<option value="">Select</option>
<option>Bluesky</option>
<option>FaceBook</option>
<option>InstaGram</option>
<option>Linkedin</option>
<option>YouTube</option>
</select>
</div>

<label>Priority</label>
<select id="priority">
<option>Medium</option>
<option>High</option>
<option>Low</option>
<option>VIP</option>
<option>Urgent</option>
</select>

<label>Message</label>
<textarea id="comment"></textarea>

<button type="submit">Submit</button>

<div id="msg"></div>

</form>

</div>

<script>
const leadsource = document.getElementById("leadsource");
const socialBox = document.getElementById("socialBox");

leadsource.addEventListener("change", function(){
  if(this.value === "Social Media"){
    socialBox.classList.remove("hidden");
  }else{
    socialBox.classList.add("hidden");
  }
});

document.getElementById("leadForm").addEventListener("submit", async function(e){

e.preventDefault();

const data = {
displayName: document.getElementById("name").value,
email: document.getElementById("email").value,
phone: document.getElementById("phone").value,
stakeholder: document.getElementById("stakeholder").value,
interest: document.getElementById("interest").value,
comment: document.getElementById("comment").value
};

const msg = document.getElementById("msg");
msg.innerHTML = "Submitting...";

try{

const response = await fetch("https://bluesky-volunteer-form-production.up.railway.app",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
});

if(response.ok){
msg.innerHTML = '<p class="success">Submitted Successfully 🎉</p>';
document.getElementById("leadForm").reset();
socialBox.classList.add("hidden");
}else{
msg.innerHTML = '<p class="error">Submission failed ❌</p>';
}

}catch(err){
msg.innerHTML = '<p class="error">Network error ❌</p>';
}

});
</script>

</body>
</html>
