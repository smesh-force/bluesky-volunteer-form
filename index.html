<!DOCTYPE html>
<html>
<head>
  <title>Lead form</title>
</head>
<body>
  <h2>Get in Touch</h2>
<p>Please fill out the form and we’ll contact you shortly.</p>

  <form id="volunteerForm">

  <input type="text" id="name" placeholder="Full Name" required />

  <input type="email" id="email" placeholder="Email Address" />

  <input type="tel" id="phone" placeholder="Phone Number" />

  <!-- NEW FIELD: Segment -->
  <select id="segment" required>
    <option value="">Select Segment</option>
    <option value="Volunteer">Volunteer</option>
    <option value="Donor">Donor</option>
    <option value="Supporter">Supporter</option>
  </select>

  <textarea id="message" placeholder="Why do you want to join?"></textarea>

  <button type="submit">Submit</button>
</form>

 <script>
document.getElementById("volunteerForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const data = {
    displayName: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    segment: document.getElementById("segment").value || "Volunteer",
    comment: document.getElementById("message").value,
    action: "web-form"
  };

  try {
    const response = await fetch("https://bluesky-volunteer-form.up.railway.app/lead", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    if (response.ok) {
      alert("Success! Lead submitted 🎉");
      document.getElementById("volunteerForm").reset();
    } else {
      alert("Failed to submit ❌");
    }

  } catch (error) {
    console.error(error);
    alert("Network error ❌");
  }
});
</script>
